{% extends "layouts/main.html" %}

{% block pageTitle %}
  GOV.UK page template – {{ serviceName }} – GOV.UK Prototype Kit
{% endblock %}

{% block content %}

<a href="case-review-landing.html" class="govuk-back-link">Back</a>

<div class="govuk-form-group">
  <fieldset class="govuk-fieldset">
    <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
      <h1 class="govuk-fieldset__heading">
        Select Test
      </h1>
    </legend>
    <div class="govuk-radios" data-module="govuk-radios">
      <div class="govuk-radios__item">
        <input class="govuk-radios__input" id="whereDoYouLive" name="whereDoYouLive" type="radio" value="full code test">
        <label class="govuk-label govuk-radios__label" for="whereDoYouLive">
          Full code test
        </label>
      </div>
      <div class="govuk-radios__item">
        <input class="govuk-radios__input" id="whereDoYouLive-2" name="whereDoYouLive" type="radio" value="threshold test">
        <label class="govuk-label govuk-radios__label" for="whereDoYouLive-2">
          Threshold test
        </label>
      </div>
      <div class="govuk-radios__item">
        <input class="govuk-radios__input" id="whereDoYouLive-3" name="whereDoYouLive" type="radio" value="early advice">
        <label class="govuk-label govuk-radios__label" for="whereDoYouLive-3">
          Early advice
        </label>
      </div>
    
    </div>
  </fieldset>  
</div>

<div class="govuk-button-group">
  <a href="case-headline.html" role="button" draggable="false" class="govuk-button" data-module="govuk-button">
    Save and continue
  </a>
  <a class="govuk-link" href="case-review-landing.html">Save and exit</a>
</div>
      




{% endblock %}
